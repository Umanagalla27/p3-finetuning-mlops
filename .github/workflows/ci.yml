name: P3 Fine-Tuning & MLOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Data Prep & Benchmark Setup
        run: |
          python src/training/prepare_dataset.py
          python src/serving/benchmark_serving.py
          python src/mlops/track_experiment.py

      - name: Run CI Evaluation Gate
        run: |
          pytest tests/test_p3_ci_gate.py -v
